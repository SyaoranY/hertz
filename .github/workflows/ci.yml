name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure GCC
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_STANDARD=14 \
            -DHERTZ_BUILD_TESTS=ON

      - name: Configure Clang
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_STANDARD=14 \
            -DHERTZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  consumer-install-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure minimal build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DHERTZ_BUILD_TESTS=OFF

      - name: Consumer install test
        run: |
          cmake --install build --prefix "${{github.workspace}}/install"

          cmake \
            -S tests/package_consumer \
            -B consumer-build \
            -DCMAKE_PREFIX_PATH="${{github.workspace}}/install"

          cmake --build consumer-build --parallel

          ./consumer-build/hertz_consumer